<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F4F7FA"/>
  <text x="600" y="68" font-size="38" font-weight="bold" fill="#1F3A4F" text-anchor="middle">O que mudou: a barreira sumiu</text>
  <rect x="60" y="120" width="520" height="440" rx="24" fill="#E4ECF1"/>
  <rect x="620" y="120" width="520" height="440" rx="24" fill="#F3E4E1"/>
  <text x="320" y="176" font-size="30" font-weight="bold" fill="#3D677F" text-anchor="middle">Antigamente</text>
  <text x="880" y="176" font-size="30" font-weight="bold" fill="#A53D36" text-anchor="middle">Hoje</text>
  <g fill="#3D677F">
    <rect x="130" y="250" width="40" height="150" rx="4"/><rect x="180" y="250" width="40" height="150" rx="4"/><rect x="230" y="250" width="40" height="150" rx="4"/>
    <rect x="280" y="250" width="40" height="150" rx="4"/><rect x="330" y="250" width="40" height="150" rx="4"/><rect x="380" y="250" width="40" height="150" rx="4"/><rect x="430" y="250" width="40" height="150" rx="4"/>
  </g>
  <text x="320" y="450" font-size="22" fill="#1F3A4F" text-anchor="middle">banca, locadora, cinema</text>
  <text x="320" y="484" font-size="22" fill="#1F3A4F" text-anchor="middle">era preciso dar a cara</text>
  <text x="320" y="518" font-size="22" fill="#1F3A4F" text-anchor="middle">e sair com o material escondido</text>
  <rect x="800" y="236" width="160" height="190" rx="24" fill="#A53D36"/>
  <rect x="812" y="252" width="136" height="150" rx="12" fill="#fff"/>
  <circle cx="880" cy="414" r="6" fill="#fff"/>
  <text x="880" y="340" font-size="26" font-weight="bold" fill="#A53D36" text-anchor="middle">18+</text>
  <text x="880" y="464" font-size="22" fill="#1F3A4F" text-anchor="middle">no bolso, a qualquer hora</text>
  <text x="880" y="498" font-size="22" fill="#1F3A4F" text-anchor="middle">a um clique de distância</text>
  <text x="880" y="532" font-size="22" fill="#1F3A4F" text-anchor="middle">e de graça</text>
</svg>
