  <text x="650" y="477" font-size="19" font-weight="bold" fill="#4E8B78" text-anchor="middle">mês 4</text>
  <text x="730" y="462" font-size="36" font-weight="bold" fill="#213A4F">3 a 4 meses</text>
  <text x="730" y="505" font-size="22" fill="#213A4F" opacity=".8">sessões mensais, direto ao ponto</text>
  <text x="70" y="585" font-size="20" fill="#8A7A66">Tempo habitual do tratamento. Cada caso é avaliado na primeira consulta.</text>
