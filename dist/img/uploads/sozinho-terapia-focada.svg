    <circle cx="490" cy="165" r="16" opacity=".55"/><circle cx="540" cy="165" r="16" opacity=".5"/>
    <circle cx="590" cy="165" r="16" opacity=".45"/><circle cx="640" cy="165" r="16" opacity=".4"/>
    <circle cx="690" cy="165" r="16" opacity=".35"/><circle cx="740" cy="165" r="16" opacity=".3"/>
