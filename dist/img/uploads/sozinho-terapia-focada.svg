  <text x="70" y="240" font-size="30" fill="#213A4F" opacity=".75">toda semana, por tempo indeterminado...</text>
  <line x1="70" y1="305" x2="1130" y2="305" stroke="#E9DFCF" stroke-width="3"/>
  <text x="70" y="370" font-size="22" letter-spacing="3" fill="#4E8B78">COMO EU TRABALHO</text>
  <line x1="150" y1="470" x2="650" y2="470" stroke="#9DB8AE" stroke-width="6"/>
  <g>
    <circle cx="150" cy="470" r="42" fill="#4E8B78"/>
    <circle cx="317" cy="470" r="42" fill="#4E8B78"/>
    <circle cx="484" cy="470" r="42" fill="#4E8B78"/>
