  <rect width="1200" height="630" fill="#FAF7F2"/>
  <text x="70" y="90" font-size="22" letter-spacing="3" fill="#8A7A66">O QUE MUITA GENTE IMAGINA</text>
  <g fill="#B9B2A6">
    <circle cx="90" cy="165" r="16" opacity=".95"/><circle cx="140" cy="165" r="16" opacity=".9"/>
    <circle cx="190" cy="165" r="16" opacity=".85"/><circle cx="240" cy="165" r="16" opacity=".8"/>
    <circle cx="290" cy="165" r="16" opacity=".75"/><circle cx="340" cy="165" r="16" opacity=".7"/>
