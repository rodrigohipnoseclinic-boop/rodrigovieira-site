# Agenda do Dr. Rodrigo Vieira: site separado do site principal.
# Não há etapa de build: as páginas ficam em /public e o backend em netlify/functions.
[build]
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "22"

# A página inicial da agenda é o agendamento.
[[redirects]]
  from = "/"
  to = "/agendar/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Painel e links de sessão nunca aparecem em buscadores nem vazam o endereço.
[[headers]]
  for = "/painel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/sessao/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
